name: Build & Release Nokia S40 WhatsApp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-client:
    name: Build J2ME Client (.JAR & .JAD)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Download MIDP & CLDC Libraries
      run: |
        mkdir -p lib
        curl -sL https://repo1.maven.org/maven2/org/microemu/midpapi20/2.0.4/midpapi20-2.0.4.jar -o lib/midpapi20.jar
        curl -sL https://repo1.maven.org/maven2/org/microemu/cldcapi11/2.0.4/cldcapi11-2.0.4.jar -o lib/cldcapi11.jar

    - name: Build JAR and JAD
      run: |
        chmod +x build.sh
        ./build.sh

    - name: Upload JAR/JAD Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: WhatsApp-Nokia-S40
        path: |
          build/WhatsApp-S40.jar
          build/WhatsApp-S40.jad

  build-server:
    name: Verify Server & Docker Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Server Dependencies
      run: |
        cd server
        npm ci || npm install

    - name: Build Docker Container
      run: |
        docker build -t nokia-s40-whatsapp-bridge:latest ./server
